<script>
        // Simple drag and drop visual feedback
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        dropzone.addEventListener('click', () => {
            fileInput.click();
        });
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, highlight, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, unhighlight, false);
        });
        function highlight(e) {
            dropzone.classList.add('bg-signal-orange/10');
            dropzone.classList.add('border-signal-orange');
        }
        function unhighlight(e) {
            dropzone.classList.remove('bg-signal-orange/10');
            dropzone.classList.remove('border-signal-orange');
        }
        dropzone.addEventListener('drop', handleDrop, false);
        function handleDrop(e) {
            let dt = e.dataTransfer;
            let files = dt.files;

            // In a real app, handle the file upload here
            console.log("File dropped:", files[0]?.name);

            // Visual feedback of drop
            const icon = dropzone.querySelector('.material-symbols-outlined');
            const originalIcon = icon.innerText;
            icon.innerText = 'check_circle';
            icon.classList.add('text-signal-orange');

            setTimeout(() => {
                icon.innerText = originalIcon;
                icon.classList.remove('text-signal-orange');
            }, 2000);
        }
    </script>
