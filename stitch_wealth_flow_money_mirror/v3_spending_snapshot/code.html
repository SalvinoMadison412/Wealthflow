<!DOCTYPE html><html lang="en"><head>

<style>
        .ambient-shadow {
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.04);
        }

<body class="bg-surface-container-lowest text-on-surface font-body-md min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 sticky flex justify-between items-center px-margin-page py-stack-sm z-40 transition-transform duration-200 bg-surface">
<button aria-label="Menu" class="flex items-center justify-center text-primary hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tighter">Wealth Flow</h1>
<button aria-label="Notifications" class="flex items-center justify-center text-primary hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-grow pb-32 w-full md:max-w-[600px] md:mx-auto">
<!-- Header Section -->
<section class="px-margin-page pt-stack-lg pb-stack-md">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-stack-sm">
                Your Story.
            </h1>
<p class="font-body-lg text-body-lg text-secondary">
                A snapshot of your financial flow this month.
            </p>
</section>
<!-- Insights Bento Grid -->
<section class="px-margin-page flex flex-col gap-stack-md mt-stack-sm">
<!-- Card 1: Impulse -->
<article class="bg-surface-container-lowest rounded-xl p-8 ambient-shadow border border-secondary-container/40 flex flex-col">
<div class="absolute top-8 left-8 w-2 h-2 rounded-full bg-signal-orange"></div>
<h2 class="font-headline-md text-headline-md text-on-surface mt-6 pr-4">
                    You tend to impulse spend on weekends.
                </h2>
</article>
<!-- Card 2: Experiences -->
<article class="bg-surface-container-lowest rounded-xl p-8 ambient-shadow border border-secondary-container/40 flex flex-col">
<div class="font-display-lg text-display-lg text-signal-orange mb-2">
                    60%
                </div>
<p class="font-body-lg text-body-lg text-secondary">
                    of your energy flows into experiences.
                </p>
</article>
<!-- Card 3: Savings -->
<article class="bg-surface-container-lowest rounded-xl p-8 ambient-shadow border border-secondary-container/40 flex flex-col">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-signal-orange" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">
                    Your core savings rate is solidifying.
                </h2>
</article>
</section>
</main>
<!-- BottomNavBar (Mobile Only shell logic) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-margin-page pb-8 bg-surface/80 backdrop-blur-md h-20 z-50">
<!-- Inactive: Home -->
<button aria-label="Home" class="text-secondary flex flex-col items-center justify-center hover:text-primary-container transition-colors active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="home_max">home_max</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<!-- Active: Insights -->
<button aria-label="Insights" class="text-primary flex flex-col items-center justify-center active:scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="insights" style="font-variation-settings: 'FILL' 1;">insights</span>
<span class="font-label-sm text-label-sm">Insights</span>
</button>
<!-- Inactive: Rule -->
<button aria-label="Rules" class="text-secondary flex flex-col items-center justify-center hover:text-primary-container transition-colors active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="rule">rule</span>
<span class="font-label-sm text-label-sm">Rules</span>
</button>
<!-- Inactive: Person -->
<button aria-label="Profile" class="text-secondary flex flex-col items-center justify-center hover:text-primary-container transition-colors active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
