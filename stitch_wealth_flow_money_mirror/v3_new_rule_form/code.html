<style>
        .ambient-shadow {
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.04);
        }
        /* Toggle Switch Styles */
        .toggle-label {
            cursor: pointer;
            text-indent: -9999px;
            width: 50px;
            height: 24px;
            background: #e2e2e2;
            display: block;
            border-radius: 100px;
            position: relative;
        }
        .toggle-label:after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #1a1c1c;
            border-radius: 90px;
            transition: 0.3s;
        }
        input:checked + .toggle-label {
            background: #e2e2e2;
        }
        input:checked + .toggle-label:after {
            left: calc(100% - 2px);
            transform: translateX(-100%);
        }
        .toggle-label:active:after {
            width: 28px;
        }
    </style>
</head>
<body class="bg-background h-full flex flex-col items-center justify-center font-body-md text-on-surface">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-background/20 backdrop-blur-md z-40 flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-[600px] rounded-lg ambient-shadow relative overflow-hidden flex flex-col">
<!-- Header -->
<div class="p-margin-page pb-stack-sm flex justify-between items-start">
<div>
<h2 class="font-headline-lg text-headline-lg text-on-surface">New Rule</h2>
<p class="font-body-md text-body-md text-secondary mt-2">Define how your transactions are categorized automatically.</p>
</div>
<button class="text-secondary hover:text-on-surface transition-colors p-2 -mr-2 -mt-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Content Area -->
<div class="p-margin-page flex-1 flex flex-col gap-stack-lg">
<!-- Toggle Section -->
<div class="flex items-center gap-4 border-b border-on-secondary-fixed/10 pb-stack-md">
<span class="font-label-md text-label-md text-on-surface transition-opacity" id="label-amount">Amount</span>
<div class="relative">
<input class="sr-only" id="rule-type-toggle" onchange="toggleRuleType()" type="checkbox">
<label class="toggle-label" for="rule-type-toggle">Toggle</label>
</div>
<span class="font-label-md text-label-md text-secondary transition-opacity" id="label-merchant">Merchant</span>
</div>
<!-- Input Fields -->
<div class="flex flex-col gap-stack-md">
<!-- Conditional Input: Amount -->
<div class="relative group" id="input-amount-container">
<label class="absolute -top-3 left-0 font-label-sm text-label-sm text-secondary transition-all" for="amount-input">₹ Amount</label>
<input class="w-full bg-transparent border-0 border-b border-outline text-on-surface font-body-lg text-body-lg pt-4 pb-2 px-0 focus:ring-0 focus:border-primary focus:border-b-2 transition-all placeholder:text-tertiary-fixed-dim" id="amount-input" placeholder="0.00" type="number">
</div>
<!-- Conditional Input: Merchant (Hidden by default) -->
<div class="relative group hidden" id="input-merchant-container">
<label class="absolute -top-3 left-0 font-label-sm text-label-sm text-secondary transition-all" for="merchant-input">Keyword</label>
<input class="w-full bg-transparent border-0 border-b border-outline text-on-surface font-body-lg text-body-lg pt-4 pb-2 px-0 focus:ring-0 focus:border-primary focus:border-b-2 transition-all placeholder:text-tertiary-fixed-dim" id="merchant-input" placeholder="e.g., Starbucks, Amazon" type="text">
</div>
<!-- Common Input: Rule Label -->
<div class="relative group mt-stack-sm">
<label class="absolute -top-3 left-0 font-label-sm text-label-sm text-secondary transition-all" for="label-input">Rule Label</label>
<input class="w-full bg-transparent border-0 border-b border-outline text-on-surface font-body-lg text-body-lg pt-4 pb-2 px-0 focus:ring-0 focus:border-primary focus:border-b-2 transition-all placeholder:text-tertiary-fixed-dim" id="label-input" placeholder="e.g., Coffee, Utilities" type="text">
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-margin-page pt-0 mt-auto">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-4 rounded-DEFAULT transition-colors">
                    Save Rule
                </button>
</div>
</div>
</div>
<script>
        function toggleRuleType() {
            const isMerchant = document.getElementById('rule-type-toggle').checked;
            const amountContainer = document.getElementById('input-amount-container');
            const merchantContainer = document.getElementById('input-merchant-container');
            const labelAmount = document.getElementById('label-amount');
            const labelMerchant = document.getElementById('label-merchant');

            if (isMerchant) {
                amountContainer.classList.add('hidden');
                merchantContainer.classList.remove('hidden');
                labelAmount.classList.add('text-secondary');
                labelAmount.classList.remove('text-on-surface');
                labelMerchant.classList.add('text-on-surface');
                labelMerchant.classList.remove('text-secondary');
            } else {
                amountContainer.classList.remove('hidden');
                merchantContainer.classList.add('hidden');
                labelAmount.classList.remove('text-secondary');
                labelAmount.classList.add('text-on-surface');
                labelMerchant.classList.remove('text-on-surface');
                labelMerchant.classList.add('text-secondary');
            }
        }
    </script>
